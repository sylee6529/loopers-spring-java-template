management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s, 10s
    tags:
      application:
        ${spring.application.name}
    # 활성화할 메트릭 명시
    enable:
      jvm: true
      system: true
      tomcat: true
      hikaricp: true
      logback: true
      process: true
      resilience4j: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - metrics
          - info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          show-components: always
          include:
            - livenessState
        readiness:
          show-components: always
          include:
            - readinessState
            - db
    prometheus:
      access: read_only
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  server:
    port: 8081
  observations:
    annotations:
      enabled: true
    key-values:
      application:
        ${spring.application.name}